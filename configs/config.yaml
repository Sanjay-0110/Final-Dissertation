# Central config: dataset paths, preprocessing hyperparams, seeds.
# PROJECT_BRIEF.md §13.

seed: 42

# Target size every dataset's images/masks are resized to (width, height).
# 352x352 matches the size most polyp-segmentation baselines in
# models/baseline_registry.py (PraNet/UACANet/Polyp-PVT family) are
# trained/evaluated at, so cross-model comparisons stay legible.
image_size: [352, 352]

fov_crop:
  gray_thresh: 10
  skip_if_coverage_above: 0.98
  # Handles circular/octagonal endoscope vignettes, whose bounding rect spans
  # the whole frame -- see data/preprocessing.py:crop_fov for why a plain
  # bounding-rect crop isn't enough on its own.
  max_inset_fraction: 0.35
  inset_step_fraction: 0.01

specular_inpaint:
  v_thresh: 200
  s_thresh: 60
  inpaint_radius: 5
  dilate_kernel_size: 5

color_normalization:
  # §7a ablation switch: frontend normalizer on vs. off, everything else held
  # fixed. Flip to false to run the "off" arm of the ablation.
  enabled: true
  minkowski_p: 6.0

# Dataset roots -- placeholders. Datasets are not downloaded into this repo
# yet (Kvasir-SEG / CVC-ClinicDB / ETIS-LaribPolypDB are trained/evaluated
# per PROJECT_BRIEF.md §2). Update these once the data is in place; folder
# layouts below are assumed conventions and may need adjusting per the actual
# download source -- see data/datasets.py.
datasets:
  kvasir_seg:
    root: ./datasets/Kvasir-SEG  # 1000 images / 1000 masks confirmed present, filenames match exactly
    images_dir: images
    masks_dir: masks
  cvc_clinicdb:
    root: ./datasets/CVC-ClinicDB/PNG  # 612 images / 612 masks confirmed present, filenames match exactly. Using PNG (not TIF) -- also present, both complete, PNG chosen since it's already in SUPPORTED_EXTENSIONS and needs no extra handling.
    images_dir: Original
    masks_dir: "Ground Truth"
  etis_larib:
    root: ./datasets/ETIS-LaribPolypDB  # 196 images / 196 masks confirmed present, filenames match exactly (standard dataset size)
    images_dir: images
    masks_dir: masks
  video:
    root: ./datasets  # Positive/negative case folders, no pixel masks (ground-truth availability unconfirmed, §2)
    positive_dirname: Positive  # capital P on disk
    negative_dirname: negative  # lowercase n on disk
    manifest_path: ./data/video_manifest.csv  # output of data/prepare_video_dataset.py

# Case-level train/test split for the video dataset (§2, §11: never frame-level).
# Phase-1 pilot: classification only (no masks yet), so this doubles as the
# per-epoch monitoring split, not a blind held-out set -- see training/train.py.
video_split:
  seed: 42
  train_ratio: 0.8
  # negative has only 3 cases: round(3*0.2)=1 test case -> 2/1 (~67/33), not
  # exact 80/20. positive has 20 cases -> exact 16/4 (80/20).
  min_test_cases: 1
  min_train_cases: 1
  # Was 1 (every frame kept) -- consecutive capsule-endoscopy frames are
  # near-duplicates, so stride=1 let the model memorize train frames and made
  # the single-video test split noisy rather than a real generalization
  # signal. 8 de-correlates train/test frames while still leaving thousands
  # of frames per case. Perceptual-hash dedup remains deferred (new dep).
  frame_stride: 8

# Proposed architecture (PROJECT_BRIEF.md §1): CompressedEncoder, shared by
# both ProposedClassifier (phase-1 pilot head) and ProposedSegmentationModel
# (phase-2, models/proposed_model.py) -- target_max_params is the ceiling for
# the encoder+decoder segmentation system.
model:
  encoder:
    base_channels: [64, 128, 256, 384, 512]  # ratio=1.0 reference widths, stem..bottleneck
    compression_ratio: 0.6
    compression_mode: asymmetric  # asymmetric | uniform -- §7b ablation flag
  target_max_params: 1470000  # UNeXt reference ceiling (models/baseline_registry.py)
  dropout: 0.3  # applied before the classifier head, phase-1 overfitting mitigation

training:
  batch_size: 32
  epochs: 20
  lr: 0.0003
  weight_decay: 0.0005  # was 1e-4; bumped for the small/imbalanced phase-1 video dataset
  num_workers: 8  # matches scripts/slurm/train_job.sbatch's --cpus-per-task=8 -- keep these in sync
  checkpoint_dir: ./checkpoints
  results_dir: ./results
  early_stop_patience: 5  # stop if test f1 hasn't improved in this many epochs

# Phase-2: ProposedSegmentationModel on Kvasir-SEG (real pixel masks).
# Kvasir-SEG has no case/video structure -- every image is independent, so
# (unlike video_split's case-level split) a plain seeded random image-level
# split is appropriate here -- see training/train_segmentation.py.
segmentation_split:
  seed: 42
  train_ratio: 0.8

segmentation_training:
  batch_size: 16  # smaller than classification's 32 -- (B,1,352,352) mask logits + decoder activations cost more memory per sample
  epochs: 100  # was 40 -- warm-start+augmentation run was still climbing (0.686 Dice) at epoch 40, not converged yet
  lr: 0.0003
  weight_decay: 0.0005
  num_workers: 8  # keep in sync with scripts/slurm/train_seg_job.sbatch's --cpus-per-task
  checkpoint_dir: ./checkpoints
  results_dir: ./results
  early_stop_patience: 15  # was 8 -- too tight for a still-improving curve; loosened so a temporary plateau doesn't cut training short again
